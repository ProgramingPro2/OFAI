[package]
name = "ofai-sim"
version = "0.1.0"
edition = "2021"
description = "Schema-v2-compatible OpenFront training simulator foundation"
license = "MIT"
publish = false

[dependencies]
indexmap = "2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[[bin]]
name = "ofai-sim"
path = "src/main.rs"

[lib]
name = "ofai_sim"
path = "src/lib.rs"
